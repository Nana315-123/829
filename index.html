<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfbf7">
<title>HAPPY BIRTHDAY TAN ANAN</title>

<style>
:root{
  --cream:#fdfbf7;
  --cream2:#fffdf7;
  --matcha:#c8ddc6;
  --matcha2:#d2e4d0;
  --matcha3:#b9d2b7;
  --blue:#b7d5e8;
  --blue2:#c4ddec;
  --gold:#e7d8a9;
  --ink:#6f7c70;
  --shadow:rgba(109,128,108,.18);
}

*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}
body{
  background:
    radial-gradient(circle at 50% 43%, rgba(210,228,208,.30), transparent 42%),
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.95), transparent 35%),
    linear-gradient(180deg,#fffefa 0%,#fdfbf7 100%);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}

.scene{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:
    max(18px,env(safe-area-inset-top))
    max(16px,4vw)
    max(18px,env(safe-area-inset-bottom));
}

/* ================================
   FILM BACKGROUND
   ================================ */

.film-strip{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  overflow:hidden;
  z-index:1;
  pointer-events:none;
}


/* white soft overlay */

.film-strip::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:20;
  background:rgba(255,255,255,.55);
  pointer-events:none;
}


/* ================================
   PHONE
   vertical film
   ================================ */

.film-track{
  position:absolute;

  top:0;
  left:0;

  display:flex;
  flex-direction:column;

  width:100%;
  height:max-content;

  gap:18px;

  animation:filmDown 30s linear infinite;
}


.film-frame{
  position:relative;
  flex:none;

  width:68vw;
  aspect-ratio:1 / 1.18;
  height:auto;

  margin:0 auto;

  padding:10px;

  background:#7d8d7c;

  border-radius:3px;

  box-shadow:
    0 8px 25px rgba(80,95,80,.12);
}


.film-frame img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:2px;
}


/* film holes */

.film-frame::before,
.film-frame::after{
  content:"";

  position:absolute;

  left:5px;
  right:5px;

  height:7px;

  background:
    repeating-linear-gradient(
      90deg,
      #f8f5ed 0 9px,
      transparent 9px 16px
    );
}


.film-frame::before{
  top:-10px;
}


.film-frame::after{
  bottom:-10px;
}

@keyframes filmDown{
  from{
    transform:translateY(-50%);
  }

  to{
    transform:translateY(0);
  }
}
  
@media (min-width:700px){

  .film-track{
    flex-direction:row;

    align-items:center;

    width:max-content;
    height:100%;

    gap:24px;

    animation:filmRight 35s linear infinite;
  }


  .film-frame{
    width:220px;
    aspect-ratio:1 / 1.18;
    height:auto;

    margin:0;
  }


  .film-frame::before,
  .film-frame::after{
    top:5px;
    bottom:5px;

    left:auto;
    right:auto;

    width:7px;
    height:auto;

    background:
      repeating-linear-gradient(
        180deg,
        #f8f5ed 0 9px,
        transparent 9px 16px
      );
  }


  .film-frame::before{
    left:-10px;
  }


  .film-frame::after{
    right:-10px;
  }


  @keyframes filmRight{
    from{
      transform:translateX(-50%);
    }

    to{
      transform:translateX(0);
    }
  }

}
  
.cake-stage{
  position:relative;
  width:100vw;
  height:100dvh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 1.25s ease,transform 1.25s ease;
  z-index:999;
}
  
  .blow-hint{
  position:absolute;
  left:50%;
  bottom:10vh;
  transform:translateX(-50%);
  color:#849482;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
  letter-spacing:.12em;
  white-space:nowrap;
  opacity:.8;
  animation:hintPulse 1.8s ease-in-out infinite;
  pointer-events:none;
}
  
.cake-stage.hide{
  opacity:0;
  transform:translateY(35px) scale(.78);
  pointer-events:none;
}
  
.cake-wrap{
  position:relative;
  width:1224px;
  max-width:none;
  flex:none;
  line-height:0;

  transform:translate(-59px, 25px);
}
  
.cake-image{
  display:block;
  width:1224px;
  height:auto;
  max-width:none;
  user-select:none;
  -webkit-user-drag:none;
}
  
.candle-flame{
  position:fixed;
  left:50vw;
  top:17vh;
  width:58px;
  height:84px;
  transform:translate(-50%,-50%);
  z-index:2147483647;
  pointer-events:none;
  border-radius:55% 45% 58% 42%;
  background:radial-gradient(ellipse at 50% 72%,#fffef1 0 15%,#fff1ad 35%,#efd27b 62%,rgba(231,193,103,0) 100%);
  filter:drop-shadow(0 0 15px rgba(235,204,116,.55));
  animation:flicker .72s ease-in-out infinite alternate;
  transition:opacity .18s ease,transform .25s ease;
}
  
.candle-flame::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:8px;
  width:24px;
  height:42px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(ellipse,#fffef8,#fff5c2 70%,transparent);
}
  
.candle-flame.blown{
  animation:none;
  opacity:0;
  transform:translate(-50%,-65%) scale(.16,.08) rotate(16deg);
  filter:blur(2px);
}
  
@keyframes flicker{0%{transform:translate(-50%,-82%) rotate(-7deg) scale(.94,1)}50%{transform:translate(-50%,-82%) rotate(3deg) scale(1.03,1.05)}100%{transform:translate(-50%,-82%) rotate(7deg) scale(.96,1)}}

.status{
  position:fixed;
  top:max(14px,calc(env(safe-area-inset-top) + 8px));
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.76);
  color:#849482;
  font:12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:opacity .3s ease;
}
.status.show{opacity:1}

.wish-card{
  position:absolute;
  z-index:30;
  width:min(88vw,520px);
  max-height:calc(100dvh - max(30px,env(safe-area-inset-top)) - max(30px,env(safe-area-inset-bottom)));
  overflow:auto;
  padding:clamp(26px,7vw,42px) clamp(21px,6vw,40px);
  border:1px solid rgba(255,255,255,.72);
  border-radius:28px;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.78),
      rgba(245,249,239,.69));
  box-shadow:
    0 25px 70px rgba(104,126,102,.15),
    inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  opacity:0;
  transform:translateY(40px) scale(.88);
  pointer-events:none;
  transition:
    opacity .9s ease,
    transform 1s cubic-bezier(.16,1,.3,1);
  text-align:center;
}
.wish-card.show{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.wish-title{
  margin:0 0 clamp(20px,5vw,28px);
  color:#6e806f;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(25px,7vw,39px);
  line-height:1.08;
  letter-spacing:.035em;
}
.wish-title span{display:block}
.wish-text{
  margin:0;
  color:#738173;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(15px,4.15vw,18px);
  line-height:1.9;
  letter-spacing:.015em;
}
.signature{
  margin-top:clamp(20px,5vw,30px);
  color:#71816f;
  font-size:clamp(17px,4.5vw,21px);
  font-style:italic;
}

.confetti{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  overflow:hidden;
  opacity:0;
  transition:opacity .8s ease;
}
.confetti.show{opacity:1}
.confetti-piece{
  position:absolute;
  top:-18px;
  width:var(--size);
  height:calc(var(--size) * .58);
  border-radius:2px;
  background:var(--piece);
  opacity:.72;
  animation:
    fall var(--duration) linear var(--delay) forwards,
    sway calc(var(--duration) * .55) ease-in-out var(--delay) infinite alternate;
}
@keyframes fall{
  to{transform:translate3d(var(--drift),110dvh,0) rotate(760deg)}
}
@keyframes sway{
  from{margin-left:-8px}
  to{margin-left:8px}
}

@media (max-height:700px){
  .cake-stage{transform:none}
}

@media (max-height:570px){
  .cake-stage{transform:none}
  .wish-card{padding-top:22px;padding-bottom:22px}
}
@media (prefers-reduced-motion:reduce){
  .flame{animation:none}
  .wish-card,.cake-stage{transition:none}
}

@media (orientation:landscape) and (max-height:520px){
  .cake-stage{transform:none}
}

@media (max-width:600px){
  .cake-wrap{
    width:190vw;
    max-width:190vw;
    transform:translate(-5vw,-75px);
  }

  .cake-image{
    width:100%;
    max-width:100%;
    height:auto;
  }

  .candle-flame{
  width:21px;
  height:35px;
  top:21vh !important;
  left:50.5vw !important;
}

  .candle-flame::after{
  width:13px;
  height:22px;
}
  
}
  
</style>
</head>

<body>

<main class="scene">

    <div class="film-strip">
  <div class="film-track">

    <div class="film-frame">
      <img src="p1.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p2.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p3.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p4.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p5.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p1.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p2.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p3.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p4.jpeg" alt="">
    </div>

    <div class="film-frame">
      <img src="p5.jpeg" alt="">
    </div>

  </div>
</div>

  <div class="status" id="status">Please enable microphone access in your browse settings</div>

  <section class="cake-stage" id="cakeStage">
    <div class="cake-wrap">
      <img class="cake-image" src="514.png" alt="">
    </div>

   <div class="blow-hint">BLOW THE CANDLE</div>
  </section>

  <div class="candle-flame" id="flame"></div>

  <article class="wish-card" id="wishCard">

    <h1 class="wish-title">
      <span>HAPPY 19TH</span>
      <span>BIRTHDAY BAOBEI !!!</span>
    </h1>

    <p class="wish-text">
      你现在是成年人世界里的第一岁了！虽然你没有明确说你要什么礼物除了说要我之外，可是我觉得如果真的什么都没有的话你会有一点点点小失望，所以思来想去我做了生日蛋糕给你，TA DAAA~
    </p>

    <div class="signature">Ah nene 🐥</div>

  </article>

  <div class="confetti" id="confetti"></div>

</main>

<script>
const BLOW_THRESHOLD = 0.20;

const BLOW_DURATION = 120;

const CONFETTI_COUNT = 40;

const flame = document.getElementById("flame");
const cakeStage = document.getElementById("cakeStage");
const wishCard = document.getElementById("wishCard");
const statusEl = document.getElementById("status");
const confetti = document.getElementById("confetti");
const cakeImage = document.querySelector(".cake-image");

function syncFlamePosition(){
  if(!flame) return;
  flame.style.left = "50vw";
  flame.style.top = "17vh";
}

window.addEventListener("resize", syncFlamePosition);
window.addEventListener("orientationchange", syncFlamePosition);
if(cakeImage){
  cakeImage.addEventListener("load", syncFlamePosition);
}


let audioContext = null;
let analyser = null;
let microphoneStream = null;
let animationFrame = null;
let blowStartTime = null;
let extinguished = false;
let revealTimer = null;

function calculateRMS(data){
  let sum = 0;
  for(let i=0;i<data.length;i++){
    const v = (data[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / data.length);
}

function createConfetti(){
  const colors = ["#fffdf7","#f3e8bd","#c4ddec","#d2e4d0"];
  const frag = document.createDocumentFragment();

  for(let i=0;i<CONFETTI_COUNT;i++){
    const piece = document.createElement("i");
    piece.className = "confetti-piece";

    piece.style.left = `${Math.random()*100}%`;
    piece.style.setProperty("--size", `${4 + Math.random()*5}px`);
    piece.style.setProperty("--piece", colors[Math.floor(Math.random()*colors.length)]);
    piece.style.setProperty("--duration", `${8 + Math.random()*8}s`);
    piece.style.setProperty("--delay", `${Math.random()*4}s`);
    piece.style.setProperty("--drift", `${-35 + Math.random()*70}px`);

    frag.appendChild(piece);
  }

  confetti.appendChild(frag);
}

function revealWish(){
  cakeStage.classList.add("hide");

  revealTimer = setTimeout(()=>{
    wishCard.classList.add("show");
    confetti.classList.add("show");
    createConfetti();
  }, 1000);
}

function blowOut(){
  if(extinguished) return;
  extinguished = true;

  if(animationFrame){
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  if(flame){
    flame.classList.add("blown");
  }

  stopMicrophone();

  setTimeout(revealWish, 1000);
}

function detectBlow(){
  if(extinguished || !analyser) return;

  const data = new Uint8Array(analyser.fftSize);

  function loop(){
    if(extinguished) return;

    analyser.getByteTimeDomainData(data);
    const volume = calculateRMS(data);

    if(volume >= BLOW_THRESHOLD){
      if(blowStartTime === null){
        blowStartTime = performance.now();
      }

      const duration = performance.now() - blowStartTime;

      if(duration >= BLOW_DURATION){
        blowOut();
        return;
      }
    }else{
      blowStartTime = null;
    }

    animationFrame = requestAnimationFrame(loop);
  }

  loop();
}

async function requestMicrophone(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showMicError();
    return;
  }

  try{
    microphoneStream =
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:false,
          noiseSuppression:false,
          autoGainControl:false
        }
      });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    if(audioContext.state === "suspended"){
      await audioContext.resume();
    }

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.12;

    const microphone =
      audioContext.createMediaStreamSource(microphoneStream);

    microphone.connect(analyser);

    statusEl.classList.remove("show");

    detectBlow();

  }catch(error){
    console.log("Microphone permission failed:", error);
    showMicError();
  }
}

function showMicError(){
  statusEl.classList.add("show");

  setTimeout(()=>{
    statusEl.classList.remove("show");
  },5000);
}

window.addEventListener("load",()=>{
  syncFlamePosition();
  requestMicrophone();
});

function stopMicrophone(){
  if(microphoneStream){
    microphoneStream.getTracks().forEach(track=>track.stop());
    microphoneStream = null;
  }

  if(audioContext){
    audioContext.close().catch(()=>{});
    audioContext = null;
  }
}

window.addEventListener("pagehide",()=>{
  if(revealTimer) clearTimeout(revealTimer);
  stopMicrophone();
});
</script>

</body>
